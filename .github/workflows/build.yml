name: Build APK

# Every push to main builds a signed APK and publishes it as a GitHub release
# tagged v<run number>. The app checks the latest release on start and offers
# to install it. If the build fails, an issue with the end of the log is opened.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        run: base64 -d app/release.keystore.b64 > app/release.keystore

      - name: Build
        shell: bash
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.${{ github.run_number }} 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk fml-collection.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FML Collection 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: fml-collection.apk
          make_latest: true

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} failed on ${{ github.sha }}."
            echo
            echo '```'
            grep -E "^e: |error:|FAILURE|What went wrong|\.java:[0-9]+: " build.log | head -60 || true
            echo
            echo "---- last lines ----"
            tail -n 80 build.log || true
            echo '```'
          } > report.md
          gh issue create --repo "${{ github.repository }}" --title "Build ${{ github.run_number }} failed" --body-file report.md
